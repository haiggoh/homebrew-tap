# Keep every formula pointed at its repo's latest GitHub release (url + sha256).
#
# Runs IN this tap, so it needs no cross-repo secret: the default GITHUB_TOKEN can push here, and
# the source repos are public, so reading their releases needs nothing extra.
#   - every 15 minutes, so a release made anywhere reaches `brew upgrade` within 15 minutes
#   - on demand (Actions tab → Run workflow, or `gh workflow run bump-formulas.yml -R haiggoh/homebrew-tap`)
#   - on `repository_dispatch` type `release-published`, for a source repo that wants it instant
#     (it then needs a token with access to this tap; not required for the scheduled path)
# The sha256 is computed from the downloaded asset. Offline tests run first; a failing test or a
# release without its tarball stops the bump instead of writing a bad formula.
# The push step (.github/scripts/push_bump.sh) rebases onto origin/main before pushing, so a
# concurrent run in the same concurrency group cannot make this one's push fail (run 44092258642).
# PRs to main (pull_request trigger) run ONLY the offline tests: the bump and push steps are
# skipped on pull_request events — a PR's GITHUB_TOKEN is read-only and there is nothing to push.
name: bump formulas

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      formula:
        description: "only this formula (file stem, e.g. free-agents); empty = all"
        required: false
        default: ""
  repository_dispatch:
    types: [release-published]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-formulas
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Offline tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Bump formulas to the latest releases
        id: bump
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ github.event.inputs.formula || github.event.client_payload.formula || '' }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--formula "$ONLY"); fi
          python3 .github/scripts/bump_formulas.py "${args[@]}" | tee bump.log
          changed=$(sed -n 's/^changed=//p' bump.log)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: github.event_name != 'pull_request' && steps.bump.outputs.changed != ''
        run: bash .github/scripts/push_bump.sh --bump-log bump.log

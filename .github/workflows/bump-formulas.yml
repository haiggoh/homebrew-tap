# Keep every formula pointed at its repo's latest GitHub release (url + sha256).
#
# Runs IN this tap, so it needs no cross-repo secret: the default GITHUB_TOKEN can push here, and
# the source repos are public, so reading their releases needs nothing extra.
#   - hourly, so a release made anywhere reaches `brew upgrade` within the hour
#   - on demand (Actions tab → Run workflow, or `gh workflow run bump-formulas.yml -R haiggoh/homebrew-tap`)
#   - on `repository_dispatch` type `release-published`, for a source repo that wants it instant
#     (it then needs a token with access to this tap; not required for the hourly path)
# The sha256 is computed from the downloaded asset. Offline tests run first; a failing test or a
# release without its tarball stops the bump instead of writing a bad formula.
name: bump formulas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      formula:
        description: "only this formula (file stem, e.g. free-agents); empty = all"
        required: false
        default: ""
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write

concurrency:
  group: bump-formulas
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Offline tests
        run: python3 .github/scripts/test_bump_formulas.py

      - name: Bump formulas to the latest releases
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ github.event.inputs.formula || github.event.client_payload.formula || '' }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--formula "$ONLY"); fi
          python3 .github/scripts/bump_formulas.py "${args[@]}" | tee bump.log
          changed=$(sed -n 's/^changed=//p' bump.log)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed != ''
        env:
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          msg=$(grep -E ' -> ' bump.log | sed 's/ (sha256.*//' | paste -sd ';' - | sed 's/;/; /g')
          git commit -m "bump: $msg" -m "Automated by .github/workflows/bump-formulas.yml"
          git push
